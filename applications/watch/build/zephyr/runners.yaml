# Available runners configured by board.cmake.
runners:
- mpcli
- jlink

# Default flash runner if --runner is not given.
flash-runner: mpcli

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: D:/watch/GItCode/zephyr_sdk/RTL87X3G_MCU_SDK_Watch_Zephyr_v1.14.3.1/realtek-app/boards/realtek/rtl87x3g_watch
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: C:/Users/Haonan_shi/zephyr-sdk-0.16.8/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb.exe

# Runner specific arguments
args:
  mpcli:
    - --ic-type=RTL87X3G
    - --reset
    - --auto-script=../../tools/mpcli/flash_autoreset.py
  jlink:
    - --dt-flash=y
    - --device=RTL87X3G
    - --speed=4000
