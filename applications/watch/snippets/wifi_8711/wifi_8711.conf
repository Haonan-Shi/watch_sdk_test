# SPI master + WiFi-AT-over-SPI + SPI/TCP throughput test snippet.
#
# Build:
#   west build -b rtl87x3g_watch/rtl8773gtp applications/watch -p \
#     -S honeygui -S honeygui_screen_410_502 -S wifi_8711
#
# Pairs wifi_8711.conf + wifi_8711.overlay. The overlay supplies the spi0_device
# and resources DT nodes the SPI master binds to; this .conf enables the
# CONFIG_WIFI_8711 module (src/module/wifi_8711), so without this snippet the
# module is not compiled at all.
#
# DO NOT use on release builds.

# WiFi-8711 AT-over-SPI module: SPI master driver + AT engine + SPI/TCP
# throughput test, and its `wifi8711` shell command group.
CONFIG_WIFI_8711=y
CONFIG_WIFI_8711_ROLE_MASTER=y
#no ready
CONFIG_WIFI_8711_TEST=n
CONFIG_SHELL=n


# The SPI bus (spi1_hs) is driven as a DMA async master toward the 8711 WiFi
# AT slave chip.
CONFIG_SPI=y
CONFIG_SPI_SLAVE=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_RTL87X3G_DMA=y
CONFIG_DMA=y

# Ring buffer lib (zephyr/lib/utils/ring_buffer.c): TX cache in the SPI master
# (app_spi_master_zephyr.c). Without this the ring_buf_* symbols are unresolved.
CONFIG_RING_BUFFER=y
