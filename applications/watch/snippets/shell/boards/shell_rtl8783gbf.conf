#----------------- Zephyr Shell Config--------------------# 
# must: core setting of zephyr shell uart
CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# must: zephyr and rtk log setting
CONFIG_LOG=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n

# must: zephyr log output by zephyr log uart, not rtk log uart
CONFIG_LOG_RTK=n

# optional: to aviod shell stack overflow
CONFIG_SHELL_STACK_SIZE=16384

# optional: zephyr shell enhence config
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_ARGC_MAX=20

# fix truncated multi-line output (e.g. `dlps help`): the default 8-byte TX
# ring forces the lowest-priority shell thread to pend-on-txdone dozens of times
# per long print, so it stalls/truncates under load. A large ring lets one write
# queue the whole output, then the UART TX IRQ drains it independent of the
# shell thread's scheduling.
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=512
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y

# optional: zephyr shell internal cmd support
CONFIG_KERNEL_SHELL=y     # kernel threads / stacks / uptime / reboot
CONFIG_DEVICE_SHELL=y     # device list
# optional: `fs` command (ls/cat/read/write/statvfs) for SD-card file
# verification, e.g. write a test file to /SD: and read it back
CONFIG_FILE_SYSTEM_SHELL=y

#----------------------Watch Shell App Config---------------------------#
CONFIG_SHELL_APP=y
# A2DP source play-music test module
CONFIG_SHELL_APP_A2DP_SRC=y

# WiFi basic test module
CONFIG_WIFI=y
CONFIG_SHELL_APP_WIFI_BASIC=y

# required by wifi_uart.c: dynamic pinctrl for MP UART switching
CONFIG_UART_ASYNC_API=y
CONFIG_PINCTRL_DYNAMIC=y

# required by wifi_sdio.c: SDIO stack for WiFi SDIO transport
CONFIG_SDHC=y
CONFIG_SDIO_STACK=y

# DLPS power-consumption test module
CONFIG_SHELL_APP_DLPS=y

# BLE-throughput monitor shell module
CONFIG_SHELL_APP_BLE_THROUGHPUT=y
