# Alipay engineering test snippet (no-GUI shell build).
#
# Build (PowerShell or any shell):
#   west build -b rtl87x3g_watch/rtl8783gbf applications/watch -p -S alipay_test
#   west build -b rtl87x3g_watch/rtl8773gtp applications/watch -p -S alipay_test
#
# Pairs alipay_test.conf + alipay_test.overlay. Board-agnostic: the on-chip
# SRAM window (0x20020000, 160K total) is identical on gbf and gtp, and the
# psram1_for_alipay TLSF region is declared per board in
# applications/watch/boards/rtl87x3g_watch_<board>.overlay (consumed via
# DT_NODELABEL, not hardcoded here).
#
# Purpose:
#   - The watch UI does not yet expose alipay / transit-code entries. This
#     snippet enables the full alipay feature set and turns on the Zephyr shell,
#     so `alipay <subcmd>` over UART can drive bind / transit / paycode / unbind
#     flows manually.
#   - Mutually exclusive with the production UI integration. Once the UI lands,
#     drop this snippet together with
#     applications/watch/src/module/alipay/alipay_test/, and promote
#     CONFIG_ALIPAY / CONFIG_ALIPAY_TRANSIT / LWIP / MBEDTLS to prj.conf.
#
# DO NOT use on release builds.

# Alipay feature switches (kept only in this snippet until the UI lands)
CONFIG_ALIPAY=y
CONFIG_ALIPAY_TRANSIT=y
CONFIG_REALTEK_SUBSYS_LWIP=y
CONFIG_REALTEK_SUBSYS_MBEDTLS=y

# Shell test entry (only used by this snippet)
CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_ALIPAY_TEST=y

# Shell handler thread stack. Default 2-3 KB is far too small: the alipay SDK
# call alipay_init_device_name does network I/O and allocates large buffers.
# 8 KB still overflows; 16 KB is safe. Shell is not on the hot path so the
# extra stack cost is acceptable.
CONFIG_SHELL_STACK_SIZE=16384

# OSIF dynamic task pool size.
# Default 10 (defined in zephyr/soc/realtek/bee/rtl87x3g/osif/Kconfig).
# Once HFP/A2DP/PBAP/PAN/audio/alipay/dfu/local-playback are all enabled the
# SMP P-256 DHKey worker fails to be created with
# "Exceed Max number of tasks: 10!", stalling BLE LESC pairing and causing a
# 30s SMP timeout (see app_ble_adv.c notes). Bumping to 20 covers alipay's
# extra worker threads.
CONFIG_OSIF_TASK_MAX_COUNT=20

# NOTE: keep board default CONFIG_HEAP_MEM_POOL_SIZE=2048.
# The SDK's register_func_on_unbind hits k_malloc fail (pool too small), but
# in practice this does not block the main alipay flow (profile transfer and
# bind-code retrieval still work).
# Bumping the pool to 16K triggers a SRAM region overflow (Zephyr enforces a
# total RAM region limit), and reshuffling sram/heap_sram in the dts cannot
# recover enough room. Leaving the default for now.
# Long-term fix: redirect alipay SDK to its own heap, or back the Zephyr
# K_HEAP with PSRAM.
