#compile and libc config
CONFIG_NEWLIB_LIBC=y
#zephyr fs config
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_DRIVER_SDMMC=y
#fat fs config
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_CODEPAGE=437
#zephyr log config
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_THREAD_ANALYZER=y
# increase buffer size and decrease thread sleep time could enhence zephyr logging performance
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=1000
CONFIG_LOG_BUFFER_SIZE=1024
#zephyr assert
CONFIG_ASSERT=y
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_NAME=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
#if do fsmk, main stack size may need to increase.
CONFIG_MAIN_STACK_SIZE=2048 
CONFIG_IDLE_STACK_SIZE=1024
#hardware device config
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_RTC=y
CONFIG_DMA=y
# 4 times of FF_MAX_SS
CONFIG_HEAP_MEM_POOL_SIZE=2048 
CONFIG_RTC_RTL87X3G=y
CONFIG_RTC_ALARM=y
CONFIG_SENSOR=y
CONFIG_QDEC_RTL87X3G=y
CONFIG_RTL87X3G_QDEC_X_AXIS_ENABLE=y
#watch app config
CONFIG_LCDC=y
CONFIG_LCDC_DBIC=y
CONFIG_LCD_SH8601Z=y
CONFIG_LOCAL_PLAYBACK=y
CONFIG_DFU=y
CONFIG_APP_SUPPORT_NORMAL_OTA=y
CONFIG_APP_GUI_USE_PSRAM=y
CONFIG_EQ=y

CONFIG_PM=y

#################next by wanghao for display########################
# LVGL Config
CONFIG_REALTEK_BUILD_LVGL=y
CONFIG_LV_CONF_SKIP=n
CONFIG_REALTEK_BUILD_LVGL_V9=y
CONFIG_REALTEK_BUILD_GUI_410_502_SQUARELINE_DEMO=y
# Display Driver Config
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y
CONFIG_REALTEK_DISPLAY_ENABLE_PPE=y
CONFIG_REALTEK_DISPLAY_ENABLE_IDU=y
CONFIG_REALTEK_LCD_SH8601Z_410_502_QSPI=y
CONFIG_REALTEK_TOUCH_CHSC6417=y
CONFIG_REALTEK_KEY_BUTTON_8773G=y

# Network shell
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=n
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416
#
# C++ Language Support
#
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y

# end of C++ Language Support

