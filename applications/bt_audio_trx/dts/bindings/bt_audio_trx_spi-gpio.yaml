description: |
    This binding provides resources required to m2s and s2m for SPI.

compatible: "bt_audio_trx_spi-gpio"

properties:
  m2s-gpios:
    type: phandle-array
    required: true
    description: M2S GPIO
  s2m-gpios:
    type: phandle-array
    required: true
    description: S2M GPIO