#################Zephyr Kernel Config########################
#compile and libc config
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_MIN_REQUIRED_HEAP_SIZE=0
#zephyr assert
CONFIG_ASSERT=y
#zephyr log config
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_THREAD_ANALYZER=y
CONFIG_LOG_RTK=y
# increase buffer size and decrease thread sleep time could enhence zephyr logging performance
CONFIG_LOG_BUFFER_SIZE=1024
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_NAME=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
# 4 times of FF_MAX_SS
CONFIG_HEAP_MEM_POOL_SIZE=2048
#################Zephyr Filesystem Config########################
#zephyr fs config
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_SDHC_RTL87X3G_READ_STATIC=y
CONFIG_SDHC_RTL87X3G_READ_STATIC_BLOCKS=32
#CONFIG_DISK_DRIVER_SDMMC=y  # SD card
#CONFIG_SDMMC_VOLUME_NAME="SD"
CONFIG_DISK_DRIVER_MMC=y    # eMMC
CONFIG_MMC_VOLUME_NAME="EMMC"
CONFIG_DISK_DRIVER_FLASH_RTK=n
CONFIG_FILE_SYSTEM_ROMFS=n
#fat fs config
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_CODEPAGE=437
CONFIG_FS_FATFS_MAX_SS=512
CONFIG_FS_FATFS_MOUNT_MKFS=n
#################Zephyr Drivers Config########################
#hardware device config
CONFIG_GPIO=y
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=y
CONFIG_I2C=y
CONFIG_RTC=n
CONFIG_DMA=y

CONFIG_RTC_RTL87X3G=y
CONFIG_RTC_ALARM=y
CONFIG_SENSOR=y
CONFIG_QDEC_RTL87X3G=y
CONFIG_RTL87X3G_QDEC_X_AXIS_ENABLE=y
CONFIG_PWM=n

#################Zephyr Tasks Config########################
#if do fsmk, main stack size may need to increase.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_IDLE_STACK_SIZE=2048
# rtk log need 252 stack size
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280

