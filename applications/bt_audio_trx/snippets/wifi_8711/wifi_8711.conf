# WiFi-8711 AT-over-SPI packaging snippet for bt_audio_trx (pairs with
# wifi_8711.overlay). Mirrors applications/watch/snippets/wifi_8711.
#
# The SPI transport is the Kconfig module src/wifi_8711, gated by
# CONFIG_WIFI_8711 (master-only). Enabling it here (as master + AT command path)
# selects RING_BUFFER (the master TX cache); the rest of the SPI stack
# (SPI / SPI_ASYNC / SPI_RTL87X3G_DMA) lives in prj.conf. This snippet only sets
# the module switches; the devicetree package (wifi_8711.overlay) adds the SPI
# master bus + sync GPIOs.
#
# The rtl8773gtp_record_pen board overlay is built WITH this snippet: it no
# longer carries its own SPI nodes, so the snippet supplies the SPI master bus,
# sync GPIOs and PSRAM buffer. The _transceiver_master overlays and the
# rtl8783gbf_record_pen overlay still carry their own spi0_device
# (spi_m2s2m-device) transceiver node; do NOT combine this snippet with those
# (duplicate SPI device on the same bus).
#
# Build (rtl8773gtp record pen + wifi_8711):
#   west build -b rtl87x3g_bt_audio_trx/rtl8773gtp applications/bt_audio_trx -p \
#       -S wifi_8711 -- \
#       -DDTC_OVERLAY_FILE=boards/rtl87x3g_bt_audio_trx_rtl8773gtp_record_pen.overlay

CONFIG_WIFI_8711=y
CONFIG_WIFI_8711_ROLE_MASTER=y
CONFIG_WIFI_8711_CMD=y
