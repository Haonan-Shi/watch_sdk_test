manifest:
  version: '1.2'
  remotes:
  - name: fork
    url-base: https://github.com/Haonan-Shi
  defaults:
    remote: fork
  projects:
  - name: zephyr
    repo-path: zephyr
    revision: 6088863e727cd5578989e65b1cabaf33810c76af
    path: zephyr
    west-commands: scripts/west-commands.yml
    import:
      file: test.yml
      path-prefix: zephyrproject
      name-allowlist:
      - cmsis
      - tinycrypt
      - mbedtls
      - fatfs
  - name: honeygui
    repo-path: HoneyGUI
    revision: ebe9378874810fd86c239f1def9488878257be6f
    path: zephyrproject/modules/honeygui
  - name: lvgl
    repo-path: lvgl
    revision: 491c579e0dafb49917100d45510e0d741a89d116
    path: zephyrproject/modules/lvgl
  - name: hal_realtek
    repo-path: zephyr-hal
    revision: 51b8588b5e9b174373f7475c5c972b514ba32872
    path: zephyrproject/modules/hal/realtek
  - name: display
    repo-path: display
    revision: 8a44eafb0e6a78952eaacbfe5ac106b80fdd373d
    path: zephyrproject/modules/display
  self:
    path: zephyrproject/realtek-app
    userdata:
      product: common
      version: v1.0.0.20
