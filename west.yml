manifest:
  self:
    path: realtek-app

  remotes:
    - name: origin
      url-base: ssh://cn4soc.rtkbf.com:29418

  defaults:
    remote: origin

  projects:
    - name: zephyr
      repo-path: HoneyRepo/zephyr
      revision: realtek-main-v3.7
      path: zephyr
      import:
          path-prefix: zephyrproject
          name-allowlist:
            - cmsis
            - tinycrypt
            - mbedtls
            - fatfs


    - name: honeygui
      revision: master
      repo-path: HoneyGUI
      path: zephyrproject/modules/honeygui

    - name: lvgl
      revision: lvgl_v9
      repo-path: HoneyRepo/lvgl
      path: zephyrproject/modules/lvgl

    - name: display
      revision: master
      repo-path: HoneyRepo/driver/display
      path: zephyrproject/modules/display

    - name: hal_realtek
      repo-path: HoneyRepo/zephyr-hal
      revision: master
      path: zephyrproject/modules/hal/realtek

    - name: sdk
      repo-path: HoneyComb
      revision: release/crb-3.14.0
      path: release-crb-3.14.0
