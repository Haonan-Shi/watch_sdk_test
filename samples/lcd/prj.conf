#compile and libc config
# TODO: use newlib libc, zephyr 3.7 has link error with "__aeabi_dxxx" apis
CONFIG_NEWLIB_LIBC=y
#zephyr log config
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
#Shell
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=n
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416

#display repo config, may need to refine
CONFIG_DISPLAY=y
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y

CONFIG_REALTEK_LCD_SH8601Z_410_502_QSPI=y
CONFIG_REALTEK_LCD_ST7265_800_480_RGB=n
CONFIG_REALTEK_LCD_ST77916_360_360_8080=n
CONFIG_REALTEK_LCD_ST7789_170_320_SPI=n

#touch repo config, may need to refine
CONFIG_REALTEK_TOUCH_CHSC6417_ZEPHYR=y

#key button repo config, may need to refine
CONFIG_REALTEK_KEY_BUTTON_8773G_ZEPHYR=n

#GPIO interrupt config for key button
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=n

#hardware device config
CONFIG_GPIO=y
CONFIG_I2C=y







