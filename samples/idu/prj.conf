
#zephyr log config
CONFIG_LOG=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
#if do fsmk, main stack size may need to increase.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
#display repo config, may need to refine
CONFIG_DISPLAY=y
CONFIG_REALTEK_DISPLAY=y
CONFIG_REALTEK_DISPLAY_ENABLE_LCDC=y
CONFIG_REALTEK_DISPLAY_ENABLE_PPE=n
CONFIG_REALTEK_DISPLAY_ENABLE_IDU=y
CONFIG_REALTEK_LCD_SH8601Z_410_502_QSPI=y

# Network shell
CONFIG_SHELL=y
CONFIG_OPENTHREAD_SHELL=n
CONFIG_SHELL_ARGC_MAX=26
CONFIG_SHELL_CMD_BUFF_SIZE=416

#
# C++ Language Support
#
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_GLIBCXX_LIBCPP=y

# end of C++ Language Support

