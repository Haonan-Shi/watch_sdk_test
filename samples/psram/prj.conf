# MANDATORY for the psram heaps - do not remove.
#
# sys_heap stores each chunk's size/left-size in the chunk header, and the
# header width depends on the "Supported heap sizes" choice in
# zephyr/lib/heap/Kconfig:
#
#   SYS_HEAP_SMALL_ONLY : 16-bit fields -> a heap must be <= 262136 bytes
#   SYS_HEAP_BIG_ONLY   : 32-bit fields for every heap
#   SYS_HEAP_AUTO       : width picked per heap at runtime from its size
#
# That choice defaults to SYS_HEAP_SMALL_ONLY when CONFIG_SRAM_SIZE <= 256,
# and this SoC has 60 KB of SRAM, so the default applies here. The psram
# heaps (heap_psram0 / heap_psram1 in the board overlay) are 2 MB each, i.e.
# 262143 chunks, which does NOT fit in the 15-bit chunk size field.
#
# AUTO (rather than BIG_ONLY) keeps the 4-byte headers for the small sram /
# dtcm / itcm heaps and only pays the 8-byte headers on the psram heaps; the
# cost is a runtime branch on every header access plus a little code size.
CONFIG_SYS_HEAP_AUTO=y

CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_SERIAL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_PRINTK=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_RTK=n

CONFIG_SHELL_STACK_SIZE=16384
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_ARGC_MAX=20
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=512
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y