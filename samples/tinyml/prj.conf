# Common configuration shared by all four tinyml applications. Per-app extras
# (e.g. bench's SERIAL / UART_INTERRUPT_DRIVEN) are pulled in via `select` in
# the app Kconfig (see src/apps/*/Kconfig).

# Logging via printk
CONFIG_LOG=y

# The prebuilt libraries (ts_realtek engine, kws_feature) call malloc/calloc/
# free and rely on newlib symbols (_impure_ptr, __assert_func); newlib also
# provides the C++ runtime symbols the engine needs. The tinyml inference
# allocations themselves are routed to the external-PSRAM heap (ts_mem.c ->
# psRam_heap.c), independent of this C library heap.
CONFIG_NEWLIB_LIBC=y

# model_tflite.cpp / model_process.cpp are C++, and the prebuilt ts_realtek
# library (TFLite-Micro) needs the C++ runtime.
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Hardware FPU (Cortex-M55, hard-float ABI) to match the prebuilt archives.
CONFIG_FPU=y

# Inference (invoke) runs deep call stacks; each app's worker uses its own stack.
CONFIG_MAIN_STACK_SIZE=4096

# The system workqueue runs the bench app's deferred RX-timeout cleanup
# (ts_free). Harmless for the other apps.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Fault diagnostics: dump callee-saved regs (r4-r11) on an exception.
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_THREAD_NAME=y

CONFIG_TINYML_APP_KWS=y
CONFIG_TINYML_APP_IC=n
CONFIG_TINYML_APP_BENCH=n
CONFIG_TINYML_APP_MOTION=n

